# Local dev stack for rpow2. Bring everything up with one command:
#
#     ./up.sh
#
# (Or `docker compose up` directly, if you don't want auto port-conflict
# resolution / health-check polling.)
#
# Services:
#   db        — Postgres 17 (data persisted in the rpow-pg-data volume)
#   install   — one-shot: npm ci + builds @rpow/shared and @rpow/solana-bridge
#   server    — Fastify API with `tsx watch` hot reload (default :8080)
#   web       — Vite dev server for the React SPA      (default :5173)
#
# Host ports and the matching base URLs are overridable via a sibling .env
# file written by ./up.sh (or set yourself before running compose).
# Per-user secrets (Resend, Solana) belong in the optional, gitignored
# docker/dev.env.local — see docker/README.md.

name: rpow2-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rpow
      POSTGRES_PASSWORD: rpow_dev
      POSTGRES_DB: rpow
    volumes:
      - rpow-pg-data:/var/lib/postgresql/data
    ports:
      # Internal services reach the db on its container port (5432).
      # Host port is configurable so dev boxes that already run a
      # postgres locally don't conflict.
      - "${RPOW_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpow -d rpow"]
      interval: 2s
      timeout: 3s
      retries: 30

  install:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /app
    command: ["bash", "/app/docker/install.sh"]
    volumes:
      - .:/app
      - rpow-node-modules:/app/node_modules
    # Idempotent: subsequent `docker compose up` calls exit fast via the
    # sentinel file at node_modules/.dev-installed.

  server:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /app
    command: ["bash", "/app/docker/server-entrypoint.sh"]
    env_file:
      - docker/dev.env
      # Optional, gitignored override layer for personal secrets like
      # RESEND_API_KEY or the SRPOW_* + BRIDGE_KEYPAIR_BASE58 trio. The
      # `required: false` flag means it's silently skipped when missing.
      - path: docker/dev.env.local
        required: false
    environment:
      DATABASE_URL: postgres://rpow:rpow_dev@db:5432/rpow
      MAGIC_LINK_BASE_URL: ${RPOW_API_BASE_URL:-http://localhost:8080}
      WEB_ORIGIN: ${RPOW_WEB_BASE_URL:-http://localhost:5173}
      PGHOST: db
      PGUSER: rpow
    volumes:
      - .:/app
      - rpow-node-modules:/app/node_modules
      - rpow-runtime:/app/.runtime
    ports:
      - "${RPOW_API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /app/apps/web
    command: ["bash", "/app/docker/web-entrypoint.sh"]
    environment:
      VITE_API_BASE_URL: ${RPOW_API_BASE_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - .:/app
      - rpow-node-modules:/app/node_modules
    ports:
      - "${RPOW_WEB_PORT:-5173}:5173"
    depends_on:
      install:
        condition: service_completed_successfully
      server:
        condition: service_started

volumes:
  # Postgres cluster data — survives `docker compose down` (use
  # `docker compose down -v` to wipe).
  rpow-pg-data:
  # node_modules in a named volume so bind-mounting the source tree from
  # the host doesn't shadow the install (and keeps perf reasonable on
  # macOS / WSL2 where bind mounts of large folders are slow).
  rpow-node-modules:
  # Holds the auto-generated Ed25519 signing-keys.env so tokens minted in
  # one session are still verifiable after a restart.
  rpow-runtime:
