name: ${COMPOSE_PROJECT_NAME:-rpow4-prod}

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rpow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rpow
    command:
      - postgres
      - -c
      - max_locks_per_transaction=512
    volumes:
      - pg18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpow -d rpow"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - internal

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - ${RPOW_PROD_ENV_FILE:-prod.env}
    environment:
      DATABASE_URL: postgres://rpow:${POSTGRES_PASSWORD}@db:5432/rpow
      WEB_ORIGIN: https://${WEB_HOST}
      TRUST_PROXY: "true"
      VIRTUAL_HOST: ${API_HOST}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${API_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: https://${WEB_HOST}
        VITE_API_DOCS_BASE_URL: https://${WEB_HOST}
        VITE_APP_URL: https://${WEB_HOST}
        VITE_PUBLIC_POSTHOG_TOKEN: ${VITE_PUBLIC_POSTHOG_TOKEN:-}
        VITE_PUBLIC_POSTHOG_HOST: ${VITE_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${WEB_HOST},www.${WEB_HOST}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${WEB_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - internal
      - proxy

networks:
  proxy:
    name: tsqr-network
    external: true
  internal:
    internal: true

volumes:
  pg18-data:
