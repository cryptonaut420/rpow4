name: ${COMPOSE_PROJECT_NAME:-rpow4-prod}

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy

  acme-companion:
    image: nginxproxy/acme-companion:2.5
    container_name: nginx-proxy-acme
    restart: unless-stopped
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    networks:
      - proxy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rpow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rpow
    command:
      - postgres
      - -c
      - max_locks_per_transaction=512
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpow -d rpow"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - internal

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - ${RPOW_PROD_ENV_FILE:-prod.env}
    environment:
      DATABASE_URL: postgres://rpow:${POSTGRES_PASSWORD}@db:5432/rpow
      WEB_ORIGIN: https://${WEB_HOST}
      VIRTUAL_HOST: ${API_HOST}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${API_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_HOST}
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${WEB_HOST}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${WEB_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - proxy

networks:
  proxy:
  internal:
    internal: true

volumes:
  pg-data:
  certs:
  vhost:
  html:
  acme:
